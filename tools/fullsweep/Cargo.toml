[package]
name = "fullsweep"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fullsweep"
path = "src/main.rs"

[[bin]]
name = "dbg"
path = "src/bin/dbg.rs"
required-features = ["dev"]

[[bin]]
name = "resetdiag"
path = "src/bin/resetdiag.rs"
required-features = ["dev"]

[features]
dev = []

[dependencies]
rawusb = { version = "0.1.7", features = ["hid"] }

[profile.release]
opt-level = 3
debug = false
